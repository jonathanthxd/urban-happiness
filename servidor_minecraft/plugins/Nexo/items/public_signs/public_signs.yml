bank_sign:
  itemname: Bank Sign
  material: PAPER
  Pack:
    model: public_signs:bank_sign
    custom_model_data: 302011
  Mechanics:
    furniture:
      properties:
        scale: 2,2,2
      limited_placing:
        roof: false
        floor: false
        wall: true
      restricted_rotation: VERY_STRICT
      block_sounds:
        place_sound: block.stone.place
        break_sound: block.stone.break
      hitbox:
        barriers:
        - -2..2,0..1,0
      drop:
        silktouch: false
        loots:
        - nexo_item: bank_sign
          probability: 1.0
