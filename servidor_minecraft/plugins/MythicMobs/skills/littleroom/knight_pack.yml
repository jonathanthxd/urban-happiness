##################
### RANDOMIZER ###
##################

KPACK_randomize_knight:
  Skills:
  - skill{s=KPACK_randomize_helmet} @self
  - skill{s=KPACK_randomize_gear} @self
  
  
  
  ### RANDOM HELMET ###
  
  
KPACK_randomize_helmet:
  Skills:
  - randomskill{s=KPACK_random_helm_1,KPACK_random_helm_2,KPACK_random_helm_3,KPACK_random_helm_4} @self
  
KPACK_random_helm_1:
  Skills:
  - setvariable{var=caster.helmet;value="1";type=INTEGER}
  
KPACK_random_helm_2:
  Skills:
  - setvariable{var=caster.helmet;value="2";type=INTEGER}
  
KPACK_random_helm_3:
  Skills:
  - setvariable{var=caster.helmet;value="3";type=INTEGER}
  
KPACK_random_helm_4:
  Skills:
  - setvariable{var=caster.helmet;value="4";type=INTEGER}
  
  
  
  ### RANDOM WEAPONS / SHIELDS ###
  
KPACK_randomize_gear:
  Skills:
  - randomskill{s=KPACK_random_longsword,KPACK_random_halberd,KPACK_random_joust} @self
  - randomskill{s=KPACK_random_flag,KPACK_random_no_flag} @self

  
KPACK_random_longsword:
  Skills:
  - setvariable{var=caster.weapon;value="longsword";type=STRING}
  - randomskill{skills=KPACK_random_shield,KPACK_random_no_shield} @self
  
KPACK_random_halberd:
  Skills:
  - setvariable{var=caster.weapon;value="halberd";type=STRING}
  - skill{s=KPACK_random_no_shield} @self

KPACK_random_no_shield:
  Skills:
  - setvariable{var=caster.shield;value="no";type=STRING}
  
KPACK_random_shield:
  Skills:
  - setvariable{var=caster.shield;value="yes";type=STRING}
  
KPACK_random_joust:
  Conditions:
  - variableEquals{var=caster.type;value="mounted"} true
  Skills:
  - setvariable{var=caster.weapon;value="joust";type=STRING}
  - setvariable{var=caster.shield;value="no";type=STRING}

KPACK_random_no_flag:
  Skills:
  - setvariable{var=caster.flag;value="no";type=STRING}
  
KPACK_random_flag:
  Skills:
  - setvariable{var=caster.flag;value="yes";type=STRING}

### THIS SETS THE KNIGHTS RANDOMIZER ###

KPACK_setrandomizer:
  Skills:
  #- message{m="<caster.var.weapon>"} @everyone
  #- message{m="<caster.var.shield>"} @everyone
  #- message{m="<caster.var.flag>"} @everyone
  #- message{m="<caster.var.helmet>"} @everyone
  - skill{s=KPACK_set_longsword} @self
  - skill{s=KPACK_set_halberd} @self
  - skill{s=KPACK_set_joust} @self
  - skill{s=KPACK_set_helmet_1} @self
  - skill{s=KPACK_set_helmet_2} @self
  - skill{s=KPACK_set_helmet_3} @self
  - skill{s=KPACK_set_helmet_4} @self
  - skill{s=KPACK_set_shield} @self
  - skill{s=KPACK_set_noshield} @self
  - skill{s=KPACK_set_flag} @self
  - skill{s=KPACK_set_noflag} @self
  
KPACK_set_longsword:
  Conditions:
  - variableEquals{var=caster.weapon;value="longsword"} true
  Skills:
  - delay 10
  
KPACK_set_halberd:
  Conditions:
  - variableEquals{var=caster.weapon;value="halberd"} true
  Skills:
  - partvis{p=sheath;em=false} @self
  - changepart{mid=kpack_knight;p=weapon_back;nmid=kpack_knight_parts;npid=halberd_back} @self
  - changepart{mid=kpack_knight;p=sword;nmid=kpack_knight_parts;npid=halberd_hand} @self
  - changepart{mid=kpack_knight_horse;p=weapon_back;nmid=kpack_knight_parts;npid=halberd_back} @self
  - changepart{mid=kpack_knight_horse;p=sword;nmid=kpack_knight_parts;npid=halberd_hand} @self
  
KPACK_set_joust:
  Conditions:
  - variableEquals{var=caster.weapon;value="joust"} true
  Skills:
  - partvis{p=sheath;em=false} @self
  - partvis{p=sword;v=true;em=false} @self
  - changepart{mid=kpack_knight_horse;p=sword;nmid=kpack_knight_parts;npid=joust} @self
  #- message{m="set joust model"} @everyone
  
KPACK_set_helmet_1:
  Conditions:
  - variableEquals{var=caster.helmet;value="1"} true
  Skills:
  - delay 10
  
KPACK_set_helmet_2:
  Conditions:
  - variableEquals{var=caster.helmet;value="2"} true
  Skills:
  - changepart{mid=kpack_knight;p=head;nmid=kpack_knight_parts;npid=head} @self
  - changepart{mid=kpack_knight_horse;p=head;nmid=kpack_knight_parts;npid=head} @self
  
KPACK_set_helmet_3:
  Conditions:
