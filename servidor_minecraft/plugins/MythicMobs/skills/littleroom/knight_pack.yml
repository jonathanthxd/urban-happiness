####################################
### DYNAMIC AIR TIME FLAIL SYSTEM ##
####################################


### EXPLOSION SWEETENER ###

KPACK_knight_exploded:
  Conditions:
  - damagecause{cause=ENTITY_EXPLOSION} true
  Skills:
  - setAI{ai=true} @self
  - ignite{d=20} @self
  - effect:particles{p=campfire_cosy_smoke;repeat=20;repeati=1;hs=.15;vs=.15;a=1} @self
  - propel{v=1} @forward{f=<random.-10to10>;so=<random.-10to10>;yo=10;lockpitch=true}
  
### DETECTS VELOCITY AND APPLIES FLAILING ###

KPACK_knight_toss_up:
  Conditions:
  - altitude{a=>2} true
  - onground false
  - ( directionalVelocity{y=<-0.5} || directionalVelocity{y=>0.5} )
  - varEquals{var=caster.toss;value="true"} cancel
  - varEquals{var=caster.jumpattack;value="true"} cancel
  Skills:
  - gcd{ticks=20}
  - setAI{ai=true} @self
  - state{s=in_air;p=2} @self
  - sound{s=littleroom_knightpack:littleroom.knight.shout;v=5;sc=HOSTILE;p="<random.float.0.9to1.1>"} @self  .25
  - setvariable{var=caster.toss;value="true";type=STRING;delay=5}
  - defaultstate{type=death;state=land_death} @self

### ENDS FLAIL ON GROUND IMPACT ###

KPACK_knight_toss_up_land:
  Cooldown: 2
  Conditions:
  - onground orElseCast gp2_goblin_toss_up_water
  - varEquals{var=caster.toss;value="true"}
  Skills:
  - gcd{ticks=40}
  - sound{s=littleroom_knightpack:littleroom.knight.armor_movement;v=1;sc=HOSTILE;p="<random.float.0.9to1.2>";delay=5} @self
  - setvariable{var=caster.toss;value="false";type=STRING;delay=40}
  - state{s=land} @self
  - state{s=in_air;r=true;p=2} @self
  - setAI{ai=false} @self
  - setAI{ai=true;delay=40} @self
  - defaultstate{type=death;state=death;delay=1} @self
  
KPACK_knight_death:
  Skills:
  - delay 40
  - effect:particles{p=poof;a=50;hs=.5;vs=.25;y=.25} @modelpart{pid=torso}
  
######################
### MOUNTED KNIGHT ###
######################


## HORSE RUN ##

KPACK_mounted_run_handler:
  Skills:
  - skill{s=KPACK_mounted_run} @self
  - skill{s=KPACK_mounted_runstop} @self .5
  - skill{s=KPACK_mounted_walk} @self
  - skill{s=KPACK_mounted_walk_proximity} @self
  
KPACK_mounted_run:
  Cooldown: 1
  Conditions:
  - varEquals{var=caster.toss;value="true"} cancel
  - incombat
  - onground true
  - targetnotwithin{d=8}
  - varEquals{var=caster.running;value="false"}
  Skills:
  - skill{s=KPACK_mounted_rear_random} @self .5
  #- message{m="running!"} @everyone
  - defaultstate{type=walk;s=run} @self
  - setspeed{type=walking;speed=1.75} @self
  - setspeed{type=walking;speed=2;delay=10} @self
  - setspeed{type=walking;speed=2.25;delay=20} @self
  - setvariable{var=caster.running;value="true";type=STRING;delay=10}
  
KPACK_mounted_runstop:
  Conditions:
  - varEquals{var=caster.toss;value="true"} cancel
  - incombat
  - targetwithin{d=5}
  - varEquals{var=caster.running;value="true"}
  - varEquals{var=caster.weapon;value="joust"} cancel
  - offgcd true
  Skills:
  #- message{m="stopping!"} @everyone
  - sound{s=littleroom_knightpack:littleroom.horse.skid;v=0.75;sc=HOSTILE;p="<random.float.0.9to1.2>"} @self
  - gcd{ticks=20}
  - state{s=fast_stop} @self
  - defaultstate{type=walk;s=walk} @self
  - lockmodel{l=true} @self
  - lockmodel{l=false;delay=10} @self
  - propel{v=.15;repeat=10;repeat=1} @forward{f=1}
  - setspeed{type=walking;speed=1.5} @self
  - setvariable{var=caster.running;value="false";type=STRING}
  - effect:particles{p=campfire_cosy_smoke;a=2;hs=.25;vs=.1;repeat=5;repeatI=2;y=.25} @self
  
KPACK_mounted_walk:
  Conditions:
  - varEquals{var=caster.toss;value="true"} cancel
  - incombat false
  - variableEquals{var=caster.running;value="true"}
  Skills:
  #- message{m="walking!"} @everyone
  - defaultstate{type=walk;s=walk} @self
  - setspeed{type=walking;speed=1.5} @self
  - setvariable{var=caster.running;value="false";type=STRING}
  
KPACK_mounted_walk_proximity:
  Conditions:
  - varEquals{var=caster.toss;value="true"} cancel
  - incombat true
  - targetwithin{d=4} true
  - variableEquals{var=caster.running;value="true"}
  Skills:
  #- message{m="walking!"} @everyone
  - defaultstate{type=walk;s=walk} @self
  - setspeed{type=walking;speed=1.5} @self
  - setvariable{var=caster.running;value="false";type=STRING}
  
