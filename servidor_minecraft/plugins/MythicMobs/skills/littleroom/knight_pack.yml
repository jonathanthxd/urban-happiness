### MOUNTED DUST ###

KPACK_mounted_dust:
  Conditions:
  - ismoving true
  Skills:
  - effect:particles{p=campfire_cosy_smoke;a=1;hs=.35;vs=.1;y=.25}


### KEYFRAME SOUNDS ###

KAG_keyframe_knightstep:
  Skills:
  - sound{s=littleroom_knightpack:littleroom.knight.step;v=0.15;sc=HOSTILE;p="<random.float.0.9to1.2>"} @self


KAG_keyframe_horsestep_soft:
  Skills:
  - sound{s=littleroom_knightpack:littleroom.horse.step;v=0.25;sc=HOSTILE;p="<random.float.0.9to1.2>"} @self
  
KAG_keyframe_horsestep_hard:
  Skills:
  - sound{s=littleroom_knightpack:littleroom.horse.step;v=0.75;sc=HOSTILE;p="<random.float.0.9to1.2>"} @self
  
  
KAG_keyframe_bodyfall:
  Skills:
  - sound{s=littleroom_knightpack:littleroom.groundimpact;v=1;sc=HOSTILE;p="<random.float.0.9to1.2>";delay=10} @self

