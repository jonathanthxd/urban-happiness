############################################

Nocsy_Ganondorf:
  Type: HUSK
  AIGoalSelectors:
  - clear
  - meleeattack
  AITargetSelectors:
  - clear
  - players
  Drops: []
  Equipment: []
  Skills:
  - model{mid=nocsy_ganondorf;n=false;tint=false} @self ~onSpawn
  - bodyclamp{m=nocsy_ganondorf;c=20} @self ~onSpawn
  - skill{s=Nocsy_Ganondorf_Attack} ~onAttack
  - skill{s=Nocsy_Ganondorf_ForceSpell} ~onDamaged =80% 1
  - skill{s=Nocsy_Ganondorf_ForceSmash} ~onDamaged =60% 1
  - skill{s=Nocsy_Ganondorf_ForceSpell} ~onDamaged =40% 1
  - skill{s=Nocsy_Ganondorf_ForceSmash} ~onDamaged =20% 1
  - skill{s=Nocsy_FPV1_CancelEvent;sync=true} @self ~onAttack
  - skill{s=Nocsy_Ganondorf_Transform_LAUNCH} ~onDamaged <=10% 1
  - skill{s=Nocsy_Ganondorf_Hurt} ~onDamaged
  - skill{s=Nocsy_FPV1_CancelEvent;sync=true} ~onDamaged <=10% 1
  - skill{s=Nocsy_Ganondorf_Sound_Ambient-Aura} ~onSpawn
  - velocity{m=set;x=0;y=0;z=0;delay=1} @self ~onDamaged
  Display: "§cGanondorf"
  Health: 800
  Damage: 0
  Modules:
    ThreatTable: true
  BossBar:
    Enabled: true
    Title: '§cGanondorf'
    Range: 40
    Color: RED
    Style: SOLID
  Options:
    Despawn: true
    AlwaysShowName: false
    PreventOtherDrops: true
    Silent: true
    KnockbackResistance: 1
    FollowRange: 20
    AttackSpeed: 1
    PreventItemPickup: true
    PreventRandomEquipment: true
    MovementSpeed: 0.22

