############################################
#             Bokoblin warrior             #
############################################

Nocsy_Bokoblin_Warrior:
  Type: HUSK
  AIGoalSelectors:
  - clear
  - meleeattack
  AITargetSelectors:
  - clear
  - players
  Drops: []
  Equipment: []
  Skills:
  - model{mid=nocsy_ganon_minion;n=false;tint=false} @self ~onSpawn
  - skill{s=Nocsy_FPV1_CancelEvent;sync=true} @self ~onAttack
  - skill{s=Nocsy_BokoblinW_Attack} ~onAttack
  - skill{s=Nocsy_Bokoblin_Hurt} ~onDamaged
  - sound{s=entity.piglin.death;v=0.6;p=0.6} @self ~onDeath
  Display: "§6Bokoblin Warrior"
  Health: 50
  Damage: 0
  Options:
    Despawn: true
    AlwaysShowName: false
    PreventOtherDrops: true
    Silent: true
    KnockbackResistance: 1
    FollowRange: 20
    AttackSpeed: 1
    PreventItemPickup: true
    PreventRandomEquipment: true
    MovementSpeed: 0.24

