#-----------  Ganondorf Smash Ground -----------#
Nocsy_Ganondorf_SmashGround:
  Conditions:
  - hastag{t=attacking} false
  - hastag{t=summoned} false
  Skills:
  - addtag{t=attacking} @self
  - addtag{t=summoned} @self
  - addtag{t=fire} @self
  - state{s=smash_ground;li=0;lo=0;speed=1} @self
  - setAI{ai=false} @self
  - delay 40
  - sound{s=entity.blaze.shoot;v=1;p=0.1} @self
