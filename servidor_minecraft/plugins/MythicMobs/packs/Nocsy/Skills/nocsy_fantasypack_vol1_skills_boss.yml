  - effect:particles{p=explosion_huge;amount=3;speed=0.01;hS=0.01;vS=0.01} @SelfLocation{y=-3}
  - summon{type=Nocsy_Ganon_CorruptedFlames;amount=1;radius=0;os=true;yRadiusUpOnly=true;yRadius=0;inheritFaction=true} @self
