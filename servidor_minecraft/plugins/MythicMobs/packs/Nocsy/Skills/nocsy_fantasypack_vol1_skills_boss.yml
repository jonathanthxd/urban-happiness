#-----------  Ganondorf Force Spell -----------#
Nocsy_Ganondorf_ForceSpell:
  Conditions:
  - hastag{t=forcespell} false
  Skills:
  - addtag{t=forcespell} @self
  - Aura{auraName=Nocsy_Ganondorf_ForceSpell-Aura;onTick=Nocsy_Ganondorf_ForceSpell-Tick;interval=10;d=2000} @self
Nocsy_Ganondorf_ForceSpell-Tick:
  Conditions:
  - hastag{t=attacking} false
  - hastag{t=fire} false
  - hastag{t=forcesmash} false
  - hastag{t=forcespell} true
  Skills:
  - removetag{t=forcespell} @self
  - skill{s=Nocsy_Ganondorf_Spell} @self

#-----------  Ganondorf Force Smash -----------#
Nocsy_Ganondorf_ForceSmash:
  Conditions:
  - hastag{t=forcespell} false
  - hastag{t=forcesmash} false
  - hastag{t=summoned} false
  Skills:
  - addtag{t=forcesmash} @self
  - Aura{auraName=Nocsy_Ganondorf_ForceSmash-Aura;onTick=Nocsy_Ganondorf_ForceSmash-Tick;interval=10;d=2000} @self
Nocsy_Ganondorf_ForceSmash-Tick:
  Conditions:
  - hastag{t=attacking} false
  - hastag{t=summoned} false
  - hastag{t=forcesmash} true
  Skills:
  - removetag{t=forcesmash} @self
  - skill{s=Nocsy_Ganondorf_SmashGround} @self
  
#-----------  Ganondorf Attack -----------#
Nocsy_Ganondorf_Attack:
  Conditions:
  - hastag{t=attacking} false
  - playerwithin{d=4} true
  Skills:
  - randomskill{s=Nocsy_Ganondorf_PierceAttack,Nocsy_Ganondorf_SlashAttack,Nocsy_Ganondorf_SmashGround}
  
#-----------  Ganondorf Pierce Attack -----------#
Nocsy_Ganondorf_PierceAttack:
  Conditions:
  - hastag{t=attacking} false
  Skills:
  - addtag{t=attacking} @self
  - state{s=pierce_attack;li=0;lo=0;speed=1.1} @self
  - setAI{ai=false} @self
  - delay 15
  - sound{s=entity.player.attack.knockback;v=1;p=0.1} @self
  - delay 6
  - damage{a=18} @LivingInCone{a=50.0;r=5.2;rot=0.0;target=players}
  - potion{type=WEAKNESS;duration=200;level=2;hasParticles=false} @LivingInCone{a=20.0;r=4;rot=0.0;target=players}
  - effect:particles{p=explosion_normal;amount=2;speed=0.1;hS=0.01;vS=0.15} @Cone{angle=20;points=50;range=4;rotation=0;yoffset=0.5}
  - delay 28
  - setAI{ai=true} @self
  - removetag{t=attacking} @self
  
#-----------  Ganondorf Slash Attack -----------#
Nocsy_Ganondorf_SlashAttack:
  Conditions:
  - hastag{t=attacking} false
  Skills:
  - addtag{t=attacking} @self
