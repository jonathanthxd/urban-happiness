  - delay 38
  - setAI{ai=true} @self
  - removetag{t=attacking} @self
  - delay 82
  - removetag{t=fire} @self # Says when the fire extinguishes so he can eventually cast another fire spell
  - delay 318
  - removetag{t=summoned} @self

