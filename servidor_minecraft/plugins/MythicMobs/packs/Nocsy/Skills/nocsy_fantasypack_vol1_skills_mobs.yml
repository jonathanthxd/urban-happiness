#-----------  BSh AI -----------#
Nocsy_BobokoblinSh_AI:
  Skills:
  - Aura{auraName=Nocsy_BobokoblinSh_AI-Aura;onTick=Nocsy_BobokoblinSh_AI-Tick;interval=10;d=916000000} @self

Nocsy_BobokoblinSh_AI-Tick:
  Conditions:
  - targetwithin{d=10} castinstead Nocsy_BobokoblinSh_AI-Stop
  - hastag{t=attacking} false
  - hastag{t=come} false
  Skills:
  - addtag{t=come} @self
  - removetag{t=flee} @self
  - removetag{t=stop} @self
  - removetag{t=idle} @self
  - runaigoalselector{goal=clear}
  - runaigoalselector{goal=meleeattack}
  - runaigoalselector{goal=randomstroll}
  - runaigoalselector{goal=lookatplayers}
Nocsy_BobokoblinSh_AI-Stop:
  Conditions:
  - targetwithin{d=5} castinstead Nocsy_BobokoblinSh_AI-Flee
  - hastag{t=attacking} false
  Skills:
  - addtag{t=stop} @self
  - removetag{t=come} @self
  - removetag{t=flee} @self
  - runaigoalselector{goal=clear}
  - runaigoalselector{goal=meleeattack}
  - runaigoalselector{goal=randomstroll}
  - runaigoalselector{goal=lookatplayers}
  - skill{s=Nocsy_BobokoblinSh_AI-Stop-IdleLoop}
Nocsy_BobokoblinSh_AI-Stop-IdleLoop:
  Conditions:
  - hastag{t=idle} false
  Skills:
  - state{s=idle_loop;li=0;lo=0;speed=1} @self
  - potion{type=SLOW;duration=35;lvl=126} @self
  - addtag{t=idle} @self
  - delay 25
  - removetag{t=idle} @self
Nocsy_BobokoblinSh_AI-Flee:
  Conditions:
  - hastag{t=attacking} false
  - hastag{t=flee} false
  Skills:
  - skill{s=Nocsy_BobokoblinSh_Explosion} 0.5
  - addtag{t=flee} @self
  - removetag{t=come} @self
  - removetag{t=stop} @self
  - removetag{t=idle} @self
  - runaigoalselector{goal=clear}
  - runaigoalselector{goal=fleeplayers}
  
