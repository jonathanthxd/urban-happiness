#-----------  BSh Attack Spell -----------#
Nocsy_BobokoblinSh_Attack_Spell:
  Conditions:
  - hastag{t=attacking} false
  Skills:
  - addtag{t=attacking} @self
  - state{s=spell_projectile;li=0;lo=0;speed=1} @self
  - sound{s=entity.piglin.angry;v=1;p=1.6} @self <=100% 0.5
  - setAI{ai=false} @self
  - delay 26
  - sound{s=entity.illusioner.cast_spell;v=1;p=0.6} @self
  - missile{
        oT=Nocsy_BobokoblinSh_Attack_Spell-Tick;
        oH=Nocsy_BobokoblinSh_Attack_Spell-End;
        oE=Nocsy_BobokoblinSh_Attack_Spell-End;
        v=8;
        hnp=false;
        i=2;
        hR=1;
        vR=1;
        in=15;
        md=80;
        sfo=1.5;
        } @PIR{r=30;limit=1;sort=RANDOM}
  - delay 7
  - setAI{ai=true} @self
  - removetag{t=attacking} @self
Nocsy_BobokoblinSh_Attack_Spell-Tick:
  Skills:
  - effect:particles{p=reddust;color=#DF01FE;amount=7;hS=0.3;vS=0.3} @origin
  - effect:particles{p=reddust;color=#8D01FE;amount=7;hS=0.3;vS=0.3} @origin
  - effect:particles{p=reddust;color=#FE01CB;amount=3;hS=0.3;vS=0.3} @origin
Nocsy_BobokoblinSh_Attack_Spell-End:
  Skills:
  - damage{a=8} @PlayersNearOrigin{r=1.5}
  - sound{s=block.amethyst_block.hit;v=1;p=0.1} @self
  - potion{type=WITHER;duration=100;lvl=1} @PIR{r=1.5}
  - effect:particlesphere{p=reddust;color=#FF00CC;amount=200;radius=1.2} @origin
  - effect:particlesphere{p=reddust;color=#A94DC0;amount=200;radius=1.2} @origin
  
