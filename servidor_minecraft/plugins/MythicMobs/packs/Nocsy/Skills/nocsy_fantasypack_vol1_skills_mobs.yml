#           Bokoblin warrior               #
############################################

#-----------  BW Attack -----------#
Nocsy_BokoblinW_Attack:
  Conditions:
  - targetwithin{d=2.2}
  - hastag{t=attacking} false
  Skills:
  - addtag{t=attacking} @self
  - state{s=attack1;li=0;lo=0;speed=1} @self
  - setAI{ai=false} @self
  - skill{s=Nocsy_Bokoblin_Attack_Sound}
  - delay 20
  - sound{s=entity.player.attack.sweep;v=1;p=0.7} @self
  - delay 3
  - damage{a=6} @LivingInCone{a=30.0;r=2.8;rot=0.0;target=players}
  - delay 10
  - setAI{ai=true} @self
  - removetag{t=attacking} @self
  

