# Orc Minion #

Orc_Minion:
  Type: ZOMBIE
  Display: '&2Orc Minion'
  Health: 15
  Damage: 2
  Options:
    MovementSpeed: 0.18
    ShowHealth: false
    PreventRandomEquipment: true
    AlwaysShowName: false
    Persistent: false
    Despawn: true
    PreventOtherDrops: true
    FollowRange: 20
    Silent: true
    KnockbackResistance: 1
    PreventSunburn: true
  Drops:
  - orc_club 1 1
  Modules:
    ThreatTable: true
  AIGoalSelectors:
  - 0 clear
  - 1 meleeattack
  - 2 movetowardstarget
  - 3 randomstroll
  AITargetSelectors:
  - 0 clear
  - 1 players
  Skills:
  - model{mid=orc_minion;n=false;step=1} @self ~onSpawn
  - effect:sound{s=orc_sounds:samus.orc_idle;volume=1;pitch=1.2} @self ~onTimer:140 0.35
  - effect:sound{s=orc_sounds:samus.orc_idle;volume=1;pitch=1.2} @self ~onDeath
  - skill{s=Changetarget} ~onTimer:160 <99%
  - skill{s=Cancelattack;sync=true} ~onAttack
  - skill{s=Orc_Minion_Attack} ~onTimer:10
  - skill{s=Orc_Minion_Run} ~onEnterCombat
  - skill{s=Orc_Minion_Walk} ~onDropCombat
  
