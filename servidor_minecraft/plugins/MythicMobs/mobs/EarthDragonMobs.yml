EarthDragon:
  Type: pillager
  Display: '&5Earth Dragon'
  Health: 500
  Damage: 0
  Options:
    Despawn: true
    Collidable: true
    LockPitch: true
    KnockbackResistance: 1
    PreventOtherDrops: true
    ApplyInvisibility: true
    Silent: true
    FollowRange: 60
    MaxCombatDistance: 80
    MovementSpeed: 0.25
    PreventMobKillDrops: true
    PreventItemPickup: true
    PreventSunburn: true
    ShowHealth: true
  KillMessages:
  - '<target.name> has been turned into thousands of pieces by Earth Dragon'
  - '<target.name> has been eaten alive by Earth Dragon'
  - '<target.name> got punched to death by Earth Dragon'
  Modules:
    ThreatTable: true
    ImmunityTable: false
  DamageModifiers:
  - MAGIC 0.01
  - FALL 0.01
  - SUFFOCATION 0.01
  Faction: EarthDragon
  BossBar:
    Enabled: true
    Title: '<#6e2c00>&lEarth Dragon &fHP:&2<caster.mhp> &fPOW:&3<caster.var.damagepower>'
    Range: 50
    Color: RED
    Style: SOLID
  AIGoalSelectors:
  - 0 clear
  - 1 MeleeAttack
  - 2 RandomStroll 
  AITargetSelectors:
  - 0 clear
  Skills:  
  - cancelevent{sync=true} @Self ~onAttack
  - model{mid=ecdragonearthboss;n=false;damagetint=false;i=true;pbone=jaws;mount=true;drive=true;ride=true;radius=120;step=2;delay=0} @self ~onSpawn 
  - model{mid=ecdragonearthboss;n=false;damagetint=false;i=true;pbone=jaws;mount=true;drive=true;ride=true;radius=120;step=2;delay=0} @self ~onLoad
  - cullconfig{vc=false;delay=1} @self ~onSpawn   
  - cullconfig{vc=false;delay=1} @self ~onLoad
  - effect:particles{p=block_crack;m=Earth_block;amount=30;speed=0;hS=0.1;vS=0.1;y=3.5} @self ~onDamaged 0.5
  - Aura{auraName=MechanicsAura;onTick=EarthDragonMechanics;interval=1;duration=999999} @self ~onSpawn
  - Aura{auraName=MechanicsAura;onTick=EarthDragonMechanics;interval=1;duration=999999} @self ~onLoad
  - Aura{auraName=AttacksCD;interval=100;duration=20} @self ~onLoad
  - summon{type=EarthDragonDeath;amount=1;radius=0} @SelfLocation ~onDeath 1
  - command{c="lp user <trigger.name> permission set mcpets.earthdragonpet true"} @trigger ~onDeath 1 
  - setvariable{var=flymaneuverability;value="0.3";type=FLOAT;scope=CASTER} @self ~onSpawn
  - setvariable{var=flypower;value="0.3";type=FLOAT;scope=CASTER} @self ~onSpawn
  - setvariable{var=damagepower;value="10.0";type=FLOAT;scope=CASTER} @self ~onSpawn
  - setvariable{var=flymaneuverability;value="0.3";type=FLOAT;scope=CASTER} @self ~onLoad
  - setvariable{var=flypower;value="0.3";type=FLOAT;scope=CASTER} @self ~onLoad
  - setvariable{var=damagepower;value="10.0";type=FLOAT;scope=CASTER} @self ~onLoad
  - remove @self ~onDeath 1
